[package]
name = "scroll"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
input-linux = "0.7"
qrcode = { version = "0.14", default-features = false }
sha1 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "signal"] }
