<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <style>
        body { display: grid; place-items: center; min-height: 100dvh; margin: 0; background: black; user-select: none }
        #st { color: white; font-size: 20dvw }
        #fs { all: unset; position: fixed; top: 3dvw; right: 3dvw; color: white; font-size: 5dvw }
    </style>
</head>
<body>
    <div id="st">⚠</div>
    <button id="fs">⛶</button>
    <script>
        fs.onclick = () =>
            document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();

        let ws;
        function connect() {
            ws = new WebSocket("ws://" + location.host + "/ws");
            ws.onopen = () => st.innerText = "";
            ws.onclose = () => { st.innerText = "⚠"; setTimeout(connect, 0) };
            ws.onerror = () => ws.close();
        }
        connect();

        let lastY = null, pending = 0;

        document.addEventListener("touchstart", e => {
            if (e.touches.length === 1) lastY = e.touches[0].clientY;
        });

        document.addEventListener("touchmove", e => {
            e.preventDefault();
            if (e.touches.length !== 1 || ws.readyState !== 1) return;
            pending += e.touches[0].clientY - lastY;
            lastY = e.touches[0].clientY;
            if (ws.bufferedAmount > 0) return;
            ws.send(new Float32Array([pending]).buffer);
            pending = 0;
        }, {passive: false});

        document.addEventListener("touchend", () => lastY = null);
    </script>
</body>
</html>
